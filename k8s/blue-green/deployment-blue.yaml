apiVersion: apps/v1
kind: Deployment

metadata:
  name: inventario-app-blue

spec:
  replicas: 2

  selector:
    matchLabels:
      app: inventario-app
      slot: blue

  template:
    metadata:
      labels:
        app: inventario-app
        slot: blue

    spec:
      containers:
        - name: inventario-app

          
          image: ghcr.io/miguis145/inventario-app:06f87ac726190688740dd3ac98a45163dd03dbca
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: APP_VERSION
              value: "v1"

            - name: APP_COLOR
              value: "blue"

            - name: STARTUP_DELAY_SECONDS
              value: "10"

            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: inventario-secret
                  key: API_KEY

          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi