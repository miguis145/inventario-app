apiVersion: apps/v1
kind: Deployment

metadata:
  name: inventario-app-green

spec:
  replicas: 2

  selector:
    matchLabels:
      app: inventario-app
      slot: green

  template:
    metadata:
      labels:
        app: inventario-app
        slot: green

    spec:
      containers:
        - name: inventario-app

          
          image: ghcr.io/miguis145/inventario-app:8a26dc39cb6ae2d23aa39387d80169f7fe649c2a
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: APP_VERSION
              value: "v2"

            - name: APP_COLOR
              value: "green"

            - name: STARTUP_DELAY_SECONDS
              value: "10"

            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: inventario-secret
                  key: API_KEY

          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi
