apiVersion: apps/v1
kind: Deployment

metadata:
  name: inventario-app
  labels:
    app: inventario-app

spec:
  # Kubernetes mantendrá dos copias de la aplicación.
  replicas: 2

  # Indica qué pods pertenecen a este Deployment.
  selector:
    matchLabels:
      app: inventario-app

  # Actualiza los pods de manera progresiva.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Como máximo un pod puede estar no disponible.
      maxUnavailable: 1

      # Puede crear temporalmente un pod adicional.
      maxSurge: 1

  # Plantilla utilizada para crear los pods.
  template:
    metadata:
      labels:
        app: inventario-app

    spec:
      containers:
        - name: inventario-app

          # CAMBIA el usuario y coloca el SHA real de tu commit.
          image: ghcr.io/miguis145/inventario-app:8a26dc39cb6ae2d23aa39387d80169f7fe649c2a

          # Obliga a Kubernetes a comprobar la imagen en GHCR.
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000

          # Variables de entorno de la aplicación.
          env:
            - name: PORT
              value: "3000"

            - name: APP_VERSION
              value: "v1"

            - name: APP_COLOR
              value: "blue"

            # Simula que la aplicación tarda 15 segundos.
            - name: STARTUP_DELAY_SECONDS
              value: "15"

            # Obtiene API_KEY desde el Secret.
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: inventario-secret
                  key: API_KEY

          # Indica cuándo el pod está listo para recibir tráfico.
          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10

          # Comprueba que la aplicación siga funcionando.
          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Recursos mínimos y máximos del contenedor.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi
