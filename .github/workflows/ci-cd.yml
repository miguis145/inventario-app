name: CI/CD Inventario App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  # =====================================================
  # JOB 1: PRUEBAS AUTOMÁTICAS
  # =====================================================
  build-test:
    name: Probar aplicación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test


  # =====================================================
  # JOB 2: CONSTRUIR, ESCANEAR Y PUBLICAR
  # =====================================================
  build-push:
    name: Construir, escanear y publicar imagen
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_REPOSITORY contiene: miguis145/inventario-app
      # Las dos comas convierten el texto a minúsculas.
      - name: Preparar nombre de imagen
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Mostrar nombre de imagen
        shell: bash
        run: |
          echo "La imagen será: ${{ steps.image.outputs.name }}"

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen para escaneo
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
          list-all-pkgs: 'false'
          version: 'v0.72.0'

      - name: Publicar etiquetas SHA y latest
        shell: bash
        run: |
          IMAGE="${{ steps.image.outputs.name }}"

          docker tag "$IMAGE:${GITHUB_SHA}" "$IMAGE:latest"

          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"